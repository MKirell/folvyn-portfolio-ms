name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        run: npm run lint

      - name: Format
        id: format
        run: npm run format:check

      - name: Test
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "## Quality — ${{ job.status }}"
            echo
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| Typecheck | ${{ steps.typecheck.outcome || 'skipped' }} |"
            echo "| Lint | ${{ steps.lint.outcome || 'skipped' }} |"
            echo "| Format | ${{ steps.format.outcome || 'skipped' }} |"
            echo "| Test with the coverage gate | ${{ steps.tests.outcome || 'skipped' }} |"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| branch | \`${{ github.ref_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
  e2e:
    needs: quality
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: End-to-end tests against a real database
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### e2e — ${{ job.status }}"
            echo
            echo "End-to-end run in a real browser. A report is attached when it fails."
          } >> "$GITHUB_STEP_SUMMARY"
  secrets:
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo"             zricethezav/gitleaks:latest detect             --source=/repo --redact --no-banner --exit-code=1
      - name: Summary
        if: always()
        run: |
          {
            echo "### secrets — ${{ job.status }}"
            echo
            echo "The tree scanned for anything that looks like a credential."
          } >> "$GITHUB_STEP_SUMMARY"
